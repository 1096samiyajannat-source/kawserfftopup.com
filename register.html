<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Kawser FF Topup</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

<h1>Create Account</h1>

<p>Bangladesh Trusted Free Fire Top-Up</p>

<input type="email" id="email" placeholder="Enter Gmail">

<input type="password" id="password" placeholder="Enter Password">

<input type="password" id="confirm" placeholder="Confirm Password">

<button class="login-btn" onclick="registerUser()">Registration Complete</button>

<p style="margin-top:20px;">
Already have an account?
<a href="login.html">Login Now</a>
</p>

</div>

<script>
function registerUser(){

let email=document.getElementById("email").value;
let pass=document.getElementById("password").value;
let confirm=document.getElementById("confirm").value;

if(email==""||pass==""||confirm==""){
alert("Please fill all fields");
return;
}

if(pass!=confirm){
alert("Password Not Match");
return;
}

document.querySelector(".login-btn").innerHTML="Loading...";

setTimeout(function(){

alert("✅ Registration Complete Successfully");

window.location.href="login.html";

},2000);

}
</script>

</body>
</html>
