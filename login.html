<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Kawser FF Topup</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

<h1>🔥 KAWSER FF TOPUP</h1>

<p>Bangladesh Trusted Free Fire Top-Up</p>

<input type="email" id="email" placeholder="Enter Gmail">

<input type="password" id="password" placeholder="Enter Password">

<button class="login-btn" onclick="loginUser()">
LOGIN
</button>

<p class="register">
Don't have an account?
<a href="register.html">Register Now</a>
</p>

<p>
<a href="#">
Forgot Password?
</a>
</p>

</div>

<script src="script.js"></script>
<script>
function registerUser(){

let email=document.getElementById("email").value;
let pass=document.getElementById("password").value;
let confirm=document.getElementById("confirm").value;

if(email==""||pass==""||confirm==""){
alert("Please fill all fields");
return;
}

if(pass!=confirm){
alert("Password Not Match");
return;
}

localStorage.setItem("userEmail",email);
localStorage.setItem("userPassword",pass);

alert("Registration Complete Successfully");

window.location.href="login.html";

}
</script>
  <script>
function loginUser(){

let email=document.getElementById("email").value;
let pass=document.getElementById("password").value;

let savedEmail=localStorage.getItem("userEmail");
let savedPass=localStorage.getItem("userPassword");

if(email==savedEmail && pass==savedPass){

alert("✅ Login Successful");

window.location.href="index.html";

}else{

alert("❌ Wrong Gmail or Password");

}

}
  </script>
</body>
</html>
