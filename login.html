<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Kawser FF Topup</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

<h1>🔥 KAWSER FF TOPUP</h1>

<p>Bangladesh Trusted Free Fire Top-Up</p>

<input type="text" placeholder="Enter UID">

<input type="password" placeholder="Password">

<button class="login-btn" onclick="registerUser()">
Registration Complete
</button>

<p class="register">
Don't have an account?
<a href="register.html">Register Now</a>
</p>

<p>
<a href="#">
Forgot Password?
</a>
</p>

</div>

<script src="script.js"></script>
<script>
function registerUser(){

let email=document.getElementById("email").value;
let pass=document.getElementById("password").value;
let confirm=document.getElementById("confirm").value;

if(email==""||pass==""||confirm==""){
alert("Please fill all fields");
return;
}

if(pass!=confirm){
alert("Password Not Match");
return;
}

localStorage.setItem("userEmail",email);
localStorage.setItem("userPassword",pass);

alert("Registration Complete Successfully");

window.location.href="login.html";

}
</script>
</body>
</html>
